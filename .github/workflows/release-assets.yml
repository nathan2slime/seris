name: Release Assets

on:
  release:
    types:
      - published

permissions:
  contents: write

env:
  APP_NAME: seris

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    env:
      TARGET: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Sync Cargo.toml version with release tag
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -eux
          CRATE_VERSION="${VERSION#v}"
          sed -Ei '0,/^version = ".*"/s//version = "'"${CRATE_VERSION}"'"/' Cargo.toml
          awk -v name="${APP_NAME}" -v version="${CRATE_VERSION}" '
            BEGIN { in_package = 0; target_package = 0 }
            /^\[\[package\]\]$/ {
              in_package = 1
              target_package = 0
              print
              next
            }
            in_package && $0 == "name = \"" name "\"" {
              target_package = 1
              print
              next
            }
            target_package && /^version = "/ {
              print "version = \"" version "\""
              target_package = 0
              in_package = 0
              next
            }
            { print }
          ' Cargo.lock > Cargo.lock.tmp
          mv Cargo.lock.tmp Cargo.lock
          grep '^version = "' Cargo.toml
          sed -n '/^\[\[package\]\]$/,/^dependencies = \[$/p' Cargo.lock | grep -A2 '^name = "seris"$'

      - name: Validate locked metadata
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Build release binary
        run: cargo build --locked --release --target "${TARGET}"

      - name: Prepare release bundle
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -eux
          ASSET_PREFIX="${APP_NAME}-${VERSION}-${TARGET}"
          PACKAGE_DIR="pkg/${ASSET_PREFIX}"
          mkdir -p "${PACKAGE_DIR}" dist
          cp "target/${TARGET}/release/${APP_NAME}" "dist/${ASSET_PREFIX}"
          cp "target/${TARGET}/release/${APP_NAME}" "${PACKAGE_DIR}/"
          cp install-local.sh "${PACKAGE_DIR}/"
          cp README.md "${PACKAGE_DIR}/"
          cp config.example.toml "${PACKAGE_DIR}/"
          chmod +x "${PACKAGE_DIR}/install-local.sh"
          sed "s/__SERIS_DEFAULT_VERSION__/${VERSION}/g" install.sh > dist/install.sh
          chmod +x dist/install.sh
          tar -C pkg -czf "dist/${ASSET_PREFIX}.tar.gz" "${ASSET_PREFIX}"
          sha256sum "dist/${ASSET_PREFIX}" > "dist/${ASSET_PREFIX}.sha256"
          sha256sum "dist/${ASSET_PREFIX}.tar.gz" > "dist/${ASSET_PREFIX}.tar.gz.sha256"
          sha256sum dist/install.sh > dist/install.sh.sha256

      - name: Upload assets to release
        env:
          VERSION: ${{ github.event.release.tag_name }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/install.sh
            dist/install.sh.sha256
            dist/${{ env.APP_NAME }}-${{ env.VERSION }}-${{ env.TARGET }}
            dist/${{ env.APP_NAME }}-${{ env.VERSION }}-${{ env.TARGET }}.sha256
            dist/${{ env.APP_NAME }}-${{ env.VERSION }}-${{ env.TARGET }}.tar.gz
            dist/${{ env.APP_NAME }}-${{ env.VERSION }}-${{ env.TARGET }}.tar.gz.sha256
