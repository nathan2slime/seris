name: Release Assets

on:
  release:
    types:
      - published

permissions:
  contents: write

env:
  APP_NAME: seris

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    env:
      TARGET: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --locked --release --target "${TARGET}"

      - name: Prepare release bundle
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -eux
          PACKAGE_DIR="pkg/${APP_NAME}-${VERSION}-${TARGET}"
          mkdir -p "${PACKAGE_DIR}" dist
          cp "target/${TARGET}/release/${APP_NAME}" "dist/${APP_NAME}-${VERSION}-${TARGET}"
          cp "target/${TARGET}/release/${APP_NAME}" "${PACKAGE_DIR}/"
          cp install-local.sh "${PACKAGE_DIR}/"
          cp README.md "${PACKAGE_DIR}/"
          cp config.example.toml "${PACKAGE_DIR}/"
          chmod +x "${PACKAGE_DIR}/install-local.sh"
          sed "s/__SERIS_DEFAULT_VERSION__/${VERSION}/g" install.sh > dist/install.sh
          chmod +x dist/install.sh
          tar -C pkg -czf "dist/${APP_NAME}-${VERSION}-${TARGET}.tar.gz" "${APP_NAME}-${VERSION}-${TARGET}"
          sha256sum "dist/${APP_NAME}-${VERSION}-${TARGET}" > "dist/${APP_NAME}-${VERSION}-${TARGET}.sha256"
          sha256sum "dist/${APP_NAME}-${VERSION}-${TARGET}.tar.gz" > "dist/${APP_NAME}-${VERSION}-${TARGET}.tar.gz.sha256"
          sha256sum dist/install.sh > dist/install.sh.sha256

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/install.sh
            dist/install.sh.sha256
            dist/${{ env.APP_NAME }}-${{ github.event.release.tag_name }}-${{ env.TARGET }}
            dist/${{ env.APP_NAME }}-${{ github.event.release.tag_name }}-${{ env.TARGET }}.sha256
            dist/*.tar.gz
            dist/*.tar.gz.sha256
