[package]
edition = "2021"
name = "seris"
version = "0.1.0"

[features]
default = ["bot", "cli"]
bot = []
cli = []

[dependencies]
chrono = "0.4.39"
config = "0.15.4"
crossterm = "0.28"
dashmap = "6.1.0"
env_logger = "0.11.6"
log = "0.4.22"
poise = "0.6.1"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
r2d2 = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = "1.0.216"
serenity = "0.12.4"
thiserror = "1.0"
tokio = {version = "1.21.2", features = ["macros", "rt-multi-thread", "signal", "sync", "time"]}

[dev-dependencies]
serde_json = "1.0"
tempfile = "3"
tokio-test = "0.4"
