[package]
edition = "2021"
name = "seris"
version = "0.1.0"

[workspace]
members = ["."]

[dependencies]
chrono = "0.4.39"
config = "0.15.4"
dashmap = "6.1.0"
env_logger = "0.11.6"
log = "0.4.22"
poise = "0.6.1"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = "1.0.216"
serenity = "0.12.4"
thiserror = "1.0"
tokio = {version = "1.21.2", features = ["macros", "rt-multi-thread", "signal", "sync"]}

[dev-dependencies]
serde_json = "1.0"
tokio-test = "0.4"
